<!doctype html>
<!-- Light theme (Felix's call). Every fx layer (aurora shader, galaxy,
     particle headline) is theme-aware and reads its palette from the CSS
     tokens — add class="dark" here to flip the whole site back to the
     cinematic dark variant. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14141A" />
    <title>Felix Noriel - Software Engineer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Variable fonts (wght ranges): ONE file per family instead of 7 static
         Montserrat weights — fewer bytes + requests, and the continuous wght
         axis powers the hero's kinetic (cursor-swell) headline. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Montserrat:wght@300..900&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Montserrat:wght@300..900&family=JetBrains+Mono:wght@400..600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- No analytics tag here on purpose: react-ga4 injects gtag.js itself at
         idle (src/utils/analytics.ts). A static tag pulled the same 170KB of
         third-party JS during the load window instead — competing with our own
         assets for a phone's bandwidth, then parsing on the main thread while
         the hero was still rendering. Nothing is lost: the injected tag fires
         the same page views, just after the page is usable. -->
  </head>
  <body>
    <!-- Static pre-hydration frame: paints the dark boot screen the instant
         HTML+CSS arrive, seconds before the JS bundle executes (first paint
         no longer waits for React). React replaces it on mount, dark→dark,
         so the swap is invisible. -->
    <style>
      #boot-static {
        position: fixed;
        inset: 0;
        /* below the React boot veil (z-100) so the animated boot can take
           over seamlessly, above all app content while it loads */
        z-index: 99;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #060611;
        color: rgba(255, 255, 255, 0.82);
        font-family: ui-monospace, Menlo, monospace;
        letter-spacing: 0.32em;
        font-size: 13px;
      }
      #boot-static .core {
        width: 46px;
        height: 46px;
        border: 1.5px solid #8effa6;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        letter-spacing: 0.16em;
        color: #fff;
        box-shadow: 0 0 18px rgba(142, 255, 166, 0.5);
      }
      #boot-static .ghost {
        position: absolute;
        left: 4vw;
        top: 16vh;
        font-family: 'Space Grotesk', 'Space Grotesk Fallback', 'Montserrat', 'Montserrat Fallback', Arial, sans-serif;
        font-weight: 700;
        /* sized to match the hero h1 so this IS the LCP element at CSS-paint
           time — if the h1 ever gets bigger than this, LCP regresses ~3s */
        font-size: clamp(30px, 9.6vw, 164px);
        line-height: 1.02;
        letter-spacing: -0.03em;
        color: rgba(160, 150, 220, 0.16);
        white-space: nowrap;
        pointer-events: none;
        overflow: hidden;
      }
      #boot-static .bar {
        width: 210px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #boot-static .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        background: #8effa6;
        animation: boot-sweep 1s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-static .bar::after { animation: none; }
      }
    </style>
    <div id="root"></div>
    <!-- OUTSIDE #root on purpose: React must never unmount this node. If it
         lived inside #root, React's first render would destroy and re-create
         the ghost headline, and Chrome would re-attribute LCP to the (much
         later) JS paint instead of this CSS paint. App.tsx removes this node
         directly when the boot veil lifts. -->
    <div id="boot-static">
      <!-- Both lines MUST stay one plain text block, split only by <br>, at
           one size. Chrome measures an LCP text candidate per block box: an
           inner block (or a smaller second line) splits this into two halves,
           each smaller than the terminal's bio paragraph — LCP then waits for
           React and jumps from ~2s to ~5s. Measured, twice. This ghost is
           never seen next to the real headline (it lives on the boot screen
           and is removed before the hero shows), so it does not need to match
           the h1's proportions. -->
      <div class="ghost" aria-hidden="true">Product Engineer<br />Problem Solver</div>
      <div class="core">FX</div>
      <div>BOOTING&nbsp;WORKSPACE</div>
      <div class="bar"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
