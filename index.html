<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the sheet's rules run to the screen edge on
         phones with a notch; every edge-anchored element pays it back with
         env(safe-area-inset-*). interactive-widget keeps the contact form
         usable under the on-screen keyboard on Android. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#f5f2ea" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Each route's real title, description, canonical and social tags are
         written in here at build time (React 19 hoists them; the prerender
         step lifts them into the head). This is only the template. -->
    <title>Felix Noriel - Product Engineer</title>
    <!-- No analytics tag here on purpose: it is injected at idle from
         src/utils/analytics.ts, after the page is usable. -->
  </head>
  <body>
    <!-- The build writes each route's fully rendered markup in here, so the
         first paint is the finished page. React hydrates it in place. -->
    <div id="root"></div>
    <script prerender type="module" src="/src/main.tsx"></script>
  </body>
</html>
